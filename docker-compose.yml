services:
  scandy-mongodb:
    image: mongo:7
    container_name: scandy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-scandy_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-scandy}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - scandy-network
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  scandy-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scandy-app:latest
    container_name: scandy-app
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD:-scandy_password}@scandy-mongodb:27017/${MONGO_INITDB_DATABASE:-scandy}?authSource=admin
      - MONGODB_DB=${MONGO_INITDB_DATABASE:-scandy}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - SYSTEM_NAME=${SYSTEM_NAME:-Scandy}
      - TZ=Europe/Berlin
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - app_uploads:/app/app/uploads
      - app_backups:/app/app/backups
      - app_logs:/app/app/logs
      - app_sessions:/app/app/flask_session
    depends_on:
      scandy-mongodb:
        condition: service_healthy
    networks:
      - scandy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scandy-mongo-express:
    image: mongo-express:latest
    container_name: scandy-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-scandy_password}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD:-scandy_password}@scandy-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-admin}
    ports:
      - "8081:8081"
    depends_on:
      scandy-mongodb:
        condition: service_healthy
    networks:
      - scandy-network

volumes:
  mongodb_data:
  app_uploads:
  app_backups:
  app_logs:
  app_sessions:

networks:
  scandy-network:
    driver: bridge
