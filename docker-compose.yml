version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scandy:latest
    container_name: scandy-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/scandy}
      - SECRET_KEY=${SECRET_KEY:-change_me_immediately}
      - PORT=${PORT:-5000}
      - SYSTEM_NAME=${SYSTEM_NAME:-Scandy}
      - TZ=${TIMEZONE:-Europe/Berlin}
    ports:
      - "${HOST_PORT:-5000}:${PORT:-5000}"
    volumes:
      - scandy_uploads:/app/app/uploads
      - scandy_backups:/app/app/backups
      - scandy_logs:/app/app/logs
      - scandy_sessions:/app/app/flask_session
    networks:
      - scandy-net

  mongodb:
    image: mongo:7
    container_name: scandy-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=scandy
    volumes:
      - scandy_db_data:/data/db
    networks:
      - scandy-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  scandy-net:
    driver: bridge

volumes:
  scandy_db_data:
  scandy_uploads:
  scandy_backups:
  scandy_logs:
  scandy_sessions:
