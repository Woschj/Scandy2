<!-- QuickScan Modal -->
<dialog id="quickScanModal" class="modal">
    <div class="modal-box w-full max-w-4xl max-h-[95vh] flex flex-col p-4 relative overflow-y-auto">
        <button class="absolute top-2 right-2 btn btn-sm btn-circle btn-ghost text-xl" onclick="document.getElementById('quickScanModal').close()" aria-label="Schließen">&times;</button>
        <div class="text-center mb-8 mt-2">
            <h3 class="text-3xl font-black tracking-tight mb-1">Quick<span class="text-primary">Scan</span></h3>
            <p class="text-xs uppercase tracking-[0.2em] font-bold opacity-30">Transaktions-Terminal</p>
        </div>

        <div class="flex flex-col md:flex-row gap-8 mb-8 justify-center items-center">
            <!-- Karte: Werkzeug/Verbrauchsgut -->
            <div id="itemCard" class="card-modern card w-full md:w-80 bg-base-200/50 cursor-pointer group" onclick="QuickScan.activateInput('item')">
                <div class="card-body items-center text-center py-10">
                    <div class="w-20 h-20 rounded-3xl bg-primary/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-tools text-3xl text-primary"></i>
                    </div>
                    <h2 class="card-title text-lg font-black leading-tight mb-2">Inventar scannen</h2>
                    <div id="itemCardContent" class="min-h-[40px] flex items-center justify-center">
                        <p class="text-xs font-bold uppercase tracking-wider opacity-40">Bereit für Scan</p>
                    </div>
                </div>
            </div>
            <!-- Karte: Mitarbeiter -->
            <div id="workerCard" class="card-modern card w-full md:w-80 bg-base-200/50 cursor-pointer group" onclick="QuickScan.activateInput('worker')">
                <div class="card-body items-center text-center py-10">
                    <div class="w-20 h-20 rounded-3xl bg-secondary/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-id-badge text-3xl text-secondary"></i>
                    </div>
                    <h2 class="card-title text-lg font-black leading-tight mb-2">Personal scannen</h2>
                    <div id="workerCardContent" class="min-h-[40px] flex items-center justify-center">
                        <p class="text-xs font-bold uppercase tracking-wider opacity-40">Bereit für Scan</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sichtbares Eingabefeld, das nur bei aktiver Karte angezeigt wird -->
        <div class="flex flex-col items-center gap-6 mt-4">
            <div id="quickScanActiveInputContainer" class="hidden w-full max-w-sm animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="relative">
                    <input type="text" id="quickScanActiveInput" class="input input-bordered w-full h-14 text-center text-xl font-bold tracking-widest rounded-2xl bg-base-200 focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all" placeholder="Barcode" autocomplete="off" />
                    <div class="absolute inset-x-4 bottom-0 h-0.5 bg-primary origin-left animate-scan-line"></div>
                </div>
            </div>
            <div class="flex gap-4 mt-2">
                <button class="btn btn-ghost btn-lg rounded-2xl px-8 hover:bg-base-content/5 active:scale-95 transition-all uppercase tracking-widest text-xs font-black" type="button" onclick="QuickScan.reset()">Reset</button>
                <button class="btn btn-primary btn-lg rounded-2xl px-12 shadow-xl shadow-primary/20 active:scale-95 transition-all uppercase tracking-widest text-xs font-black" id="quickScanConfirmBtn" type="button" onclick="QuickScan.confirm()" disabled>Bestätigen</button>
            </div>
        </div>
    </div>
</dialog>

<!-- Quantity Modal -->
<dialog id="quantityModal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">Menge eingeben</h3>
        <div class="space-y-4">
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Menge</span>
                </label>
                <input type="number" id="quantityInput" class="input input-bordered" min="1" value="1" style="height: 3rem; line-height: 1.5; padding: 0.5rem 1rem;">
            </div>
            <div class="flex justify-end space-x-4">
                <button type="button" onclick="QuickScan.closeQuantityModal()" class="btn btn-ghost">Abbrechen</button>
                <button type="button" onclick="QuickScan.confirmQuantity()" class="btn btn-primary">Bestätigen</button>
            </div>
        </div>
    </div>
</dialog>

<!-- Return Date Modal -->
<dialog id="returnDateModal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">Rückgabedatum festlegen</h3>
        <div class="space-y-4">
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Voraussichtliche Rückgabe</span>
                </label>
                <input type="date" id="returnDateInput" class="input input-bordered" style="height: 3rem; line-height: 1.5; padding: 0.5rem 1rem;">
            </div>
            <div class="text-sm text-base-content/60 mt-2">
                <i class="fas fa-info-circle mr-1"></i>
                Standard: 2 Wochen ab heute. Sie können das Datum anpassen.
            </div>
            <div class="flex justify-end space-x-4">
                <button type="button" onclick="QuickScan.closeReturnDateModal()" class="btn btn-ghost">Abbrechen</button>
                <button type="button" onclick="QuickScan.confirmReturnDate()" class="btn btn-primary">Bestätigen</button>
            </div>
        </div>
    </div>
</dialog>

<!-- JsBarcode Library -->
<script nonce="{{ csp_nonce }}" src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<!-- VIBE Easter Egg Overlay - OPTIMIERT: Videos werden nur bei Bedarf geladen -->
<div id="vibeOverlay" class="fixed inset-0 bg-black/80 z-[9999999] hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-4xl font-bold">
        VIBE MODE ACTIVATED! 🎵
    </div>
    <!-- Videos werden dynamisch erstellt, nicht im HTML geladen -->
</div>

<script nonce="{{ csp_nonce }}">
    // Bestehender Code für das Zebra-Easter Egg
    let lastInput = '';
    const danceCode = 'DANCE';
    const vibeCode = 'VIBE';
    
    document.getElementById('quickScanActiveInput').addEventListener('input', function(e) {
        lastInput = e.target.value.toUpperCase();
        
        // Zebra Easter Egg
        if (lastInput === danceCode) {
            const overlay = document.createElement('div');
            overlay.className = 'zebra-overlay';
            document.body.appendChild(overlay);
            
            const zebraLeft = document.createElement('img');
            zebraLeft.src = "{{ url_for('static', filename='images/zebra.gif') }}";
            zebraLeft.className = 'dancing-zebra left';
            zebraLeft.style.animation = 'dance 1s infinite';
            
            const zebraRight = document.createElement('img');
            zebraRight.src = "{{ url_for('static', filename='images/zebra.gif') }}";
            zebraRight.className = 'dancing-zebra right';
            zebraRight.style.animation = 'dance 1s infinite';
            
            document.body.appendChild(zebraLeft);
            document.body.appendChild(zebraRight);
            
            setTimeout(() => {
                overlay.remove();
                zebraLeft.remove();
                zebraRight.remove();
            }, 5000);
            
            e.target.value = '';
        }
        
        // VIBE Easter Egg - OPTIMIERT: Lazy Loading
        if (lastInput === vibeCode) {
            const overlay = document.createElement('div');
            overlay.className = 'zebra-overlay';
            document.body.appendChild(overlay);
            
            // OPTIMIERT: Videos erst bei Bedarf laden
            const videoLeft = document.createElement('video');
            videoLeft.className = 'dancing-zebra left';
            videoLeft.loop = true;
            videoLeft.autoplay = true;
            videoLeft.preload = 'none'; // Wichtig: Nicht vorladen!
            
            const videoRight = document.createElement('video');
            videoRight.className = 'dancing-zebra right';
            videoRight.loop = true;
            videoRight.autoplay = true;
            videoRight.preload = 'none'; // Wichtig: Nicht vorladen!
            
            // Videos erst laden wenn sie benötigt werden
            videoLeft.onloadstart = () => {
                videoLeft.src = "{{ url_for('static', filename='videos/vibe.mp4') }}";
            };
            videoRight.onloadstart = () => {
                videoRight.src = "{{ url_for('static', filename='videos/vibe.mp4') }}";
            };
            
            document.body.appendChild(videoLeft);
            document.body.appendChild(videoRight);
            
            // Sofort laden
            videoLeft.src = "{{ url_for('static', filename='videos/vibe.mp4') }}";
            videoRight.src = "{{ url_for('static', filename='videos/vibe.mp4') }}";
            
            setTimeout(() => {
                overlay.remove();
                videoLeft.remove();
                videoRight.remove();
            }, 10000);
            
            e.target.value = '';
        }
    });


</script>
