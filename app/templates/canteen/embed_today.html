<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantinenplan – Heute</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;margin:0;padding:0;background:#fff;color:#111}
    .canteen-plan{max-width:330px;margin:0 auto;padding:8px}
    .title{display:none}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{border:1px solid #e5e7eb;padding:6px;text-align:left;vertical-align:top;font-size:13px;line-height:1.2;word-break:break-word}
    th{background:#f3f4f6;font-size:12px}
    .meta{color:#374151;font-size:13px;line-height:1.2}
    .meta .date{color:#6b7280;font-size:12px;margin-top:2px}
    .footer{margin-top:6px;color:#6b7280;font-size:11px}
  </style>
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <div class="canteen-plan" id="canteen-root">
    
    <div id="canteen-loading">Lade…</div>
    <div id="canteen-error" style="display:none;color:#b91c1c">Fehler beim Laden.</div>
    <div id="canteen-table-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th style="width:50%">Menü 1 (Fleisch)</th>
            <th style="width:50%">Menü 2 (Vegan)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="meat"></td>
            <td id="vegan"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="footer" id="canteen-generated"></div>
  </div>

  <script>
    (function(){
      const apiUrl='{{ api_today or url_for("canteen.api_today", _external=True) }}';
      const loading=document.getElementById('canteen-loading');
      const errorEl=document.getElementById('canteen-error');
      const tableWrap=document.getElementById('canteen-table-wrap');
      const gen=document.getElementById('canteen-generated');
      const elMeat=document.getElementById('meat');
      const elVegan=document.getElementById('vegan');

      fetch(apiUrl, {cache:'no-store'})
        .then(r=>r.json())
        .then(data=>{
          loading.style.display='none';
          if(!data||!data.success){ errorEl.style.display='block'; return; }
          elMeat.textContent=data.meat_dish||'';
          elVegan.textContent=data.vegan_dish||'';
          tableWrap.style.display='block';
          gen.textContent=data.generated_at?`Stand: ${new Date(data.generated_at).toLocaleString('de-DE')}`:'';
        })
        .catch(()=>{ loading.style.display='none'; errorEl.style.display='block'; });
    })();
  </script>
</body>
</html>
