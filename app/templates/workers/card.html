{% extends "base.html" %}

{% block title %}Ausweis – {{ worker.firstname }} {{ worker.lastname }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 print:p-0">
  <div class="flex justify-between items-center mb-4 no-print">
    <a href="{{ url_for('workers.details', original_barcode=worker.barcode) }}" class="btn btn-ghost">
      <i class="fas fa-arrow-left mr-2"></i>Zurück
    </a>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="downloadCardImage()">
        <i class="fas fa-file-image mr-2"></i>Als Bild
      </button>
    </div>
  </div>

  <div class="flex justify-center">
    <div id="card-container" class="card bg-white shadow-xl" style="width: 85.6mm; height: 54mm;">
      <div class="card-body p-3 flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="{{ url_for('static', filename='images/scandy-logo.png') }}" alt="Logo" style="height: 12mm;">
            <span class="text-sm font-bold tracking-wide">Scandy</span>
          </div>
          <span class="dept text-xs text-gray-500">{{ worker.department or '' }}</span>
        </div>
        <div>
          <div class="text-sm font-bold leading-tight">{{ worker.firstname }} {{ worker.lastname }}</div>
        </div>
        <div class="mt-1">
          <svg id="barcode" class="w-full"></svg>
          <div class="text-center text-[9pt] tracking-widest">{{ worker.barcode }}</div>
        </div>
      </div>
    </div>
  </div>

  <style>
    /* Abteilungsnamen: Mehrfach-Leerzeichen erhalten (auch außerhalb des Drucks) */
    .dept { white-space: pre; }
    @media print {
      @page { size: A4; margin: 10mm; }
      .no-print, .navbar, .sidebar-permanent { display: none !important; }
      body { background: #fff !important; margin: 0 !important; }
      body * { visibility: hidden !important; }
      #card-container, #card-container * { visibility: visible !important; }
      #card-container {
        position: static !important;
        margin: 0 auto !important; /* zentrieren auf A4 */
        width: 85.6mm !important;
        height: 54mm !important;
        box-shadow: none !important;
        border: 0.6mm solid #222 !important;
        border-radius: 4mm !important;
        overflow: hidden;
        background: #fff !important;
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>

  <!-- Offizielle JsBarcode-Bibliothek für zuverlässiges Rendering -->
  <script nonce="{{ csp_nonce }}" src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script nonce="{{ csp_nonce }}" src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script nonce="{{ csp_nonce }}">
    const mmToPx = (mm) => Math.round(mm * (96/25.4)); // CSS: 96dpi
    document.addEventListener('DOMContentLoaded', function(){
      try {
        var value = {{ worker.barcode|tojson }} || '';
        JsBarcode('#barcode', value, {
          format: 'code128',
          displayValue: false,
          height: mmToPx(24), // höhere Balken für bessere Erkennung
          margin: mmToPx(3),  // großzügige Ruhezone links/rechts
          lineColor: '#000'
        });
      } catch(e) {}
    });

    function downloadCardImage(){
      // Isoliert in einem Iframe ohne globale Styles/OKLCH/Video-Elemente rendern
      const logoUrl = {{ url_for('static', filename='images/scandy-logo.png')|tojson }};
      const name = {{ (worker.firstname ~ ' ' ~ worker.lastname)|trim|tojson }};
      const department = {{ (worker.department or '')|tojson }};
      const barcodeTxt = {{ worker.barcode|tojson }};
      // Render sicherstellen (auch im Export)
      const svgEl = document.getElementById('barcode');
      try {
        if (svgEl && svgEl.childNodes.length === 0) {
          JsBarcode('#barcode', barcodeTxt, {format:'code128', displayValue:false, height: mmToPx(24), margin: mmToPx(3), lineColor:'#000'});
        }
      } catch(e) {}
      const svgMarkup = svgEl ? svgEl.outerHTML : '';

      const html = `<!DOCTYPE html><html><head><meta charset="utf-8">
        <style>
          html,body{margin:0;padding:0;background:#fff}
          #card-export{width:86mm;height:54mm;border:0.6mm solid #222;border-radius:4mm;box-sizing:border-box;font-family: Inter, Arial, sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:3mm;background:#fff}
          .row{display:flex;justify-content:space-between;align-items:center}
          .logo{display:flex;align-items:center;gap:2mm}
          .logo img{height:12mm}
          .name{font-weight:700;line-height:1.1;font-size:11pt}
          .dept{font-size:9pt;color:#666; white-space: pre}
          .bc{margin-top:1mm}
          .bc svg{display:block;width:100%}
          .bcnum{text-align:center;font-size:9pt;letter-spacing:2px;margin-top:0.5mm}
        </style>
      </head><body>
        <div id="card-export">
          <div class="row">
            <div class="logo"><img src="${logoUrl}" alt="Logo"><span style="font-weight:700">Scandy</span></div>
            <span class="dept">${department}</span>
          </div>
          <div class="name">${name}</div>
          <div class="bc">${svgMarkup}<div class="bcnum">${barcodeTxt}</div></div>
        </div>
      </body></html>`;

      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.left = '-99999px';
      iframe.style.top = '0';
      document.body.appendChild(iframe);
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();

      const doRender = () => {
        const node = doc.getElementById('card-export');
        if(!node){ cleanup(); return; }
        // Render in hoher Auflösung
        html2canvas(node, { backgroundColor: '#FFFFFF', scale: 3, useCORS: true, logging: false })
          .then(canvas => {
            canvas.toBlob(function(blob){
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `ausweis_${barcodeTxt}.png`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              cleanup();
            }, 'image/png');
          })
          .catch(() => cleanup());
      };
      const cleanup = () => { try { document.body.removeChild(iframe); } catch(e){} };
      // Warten bis Inhalte im Iframe geladen sind
      iframe.onload = () => setTimeout(doRender, 50);
      // Fallback, falls onload nicht feuert
      setTimeout(doRender, 300);
    }
  </script>
</div>
{% endblock %}
