<!DOCTYPE html>
<html lang="de" data-theme="scandy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Scandy Quickscan">

    <title>Scandy Quickscan</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest-quickscan.json') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/scandy-favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/scandy-favicon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Übernehme die globale App-Styles, damit Farben/Abstände wie Desktop sind -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/button-fixes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quickscan.css') }}">

    <style nonce="{{ csp_nonce }}">
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; overflow-x: hidden; }
        .mobile-container { min-height: 100vh; background: var(--fallback-b2, #e5e7eb); }
        @media (display-mode: standalone) { .mobile-container { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); } }
        /* Sicherstellen, dass Overlays und Status über Quagga-/Video-Elementen liegen */
        #cameraPreview { z-index: 20; }
        #scanOverlay { z-index: 30; }
        #scanStatus { z-index: 40; }
    </style>
</head>
<body>
    <div class="mobile-container flex items-stretch p-0">
        <div class="w-full max-w-md mx-auto">
            <div class="p-4">
                <div class="flex items-center justify-between mb-4">
                    <h1 class="text-lg font-semibold">QuickScan</h1>
                    <span class="text-xs text-gray-500">mobil</span>
                </div>

                {% if not current_user.is_authenticated %}
                <form method="POST" action="{{ url_for('mobile.login') }}" class="space-y-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-control">
                        <input type="text" name="username" placeholder="Benutzername" class="input input-bordered w-full" required autofocus>
                    </div>
                    <div class="form-control">
                        <input type="password" name="password" placeholder="Passwort" class="input input-bordered w-full" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fas fa-sign-in-alt mr-2"></i>Anmelden
                    </button>
                </form>
                {% else %}

                {% include 'mobile/quickscan_panel.html' %}
                {% endif %}
            </div>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) { regs.forEach(r => r.unregister()); });
        }
    </script>
    <!-- ZXing lokal: Library-UMD (Decoder Kern) - Lazy Loading -->
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/vendor/zxing/zxing-library.min.js') }}" defer></script>
    <!-- Quagga2: robuster Barcode-Scanner (lokal) - Lazy Loading -->
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/vendor/quagga/quagga.min.js') }}" defer></script>
    <!-- HTML5-QR-Code (Fallback-Scanner, stabil auf Mobilgeräten) -->
    <script nonce="{{ csp_nonce }}" src="https://unpkg.com/html5-qrcode"></script>
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/quickscan.js') }}?v=2"></script>
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/scanner.js') }}?v=2"></script>
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/mobile-quickscan.js') }}?v=2"></script>
</body>
</html>
