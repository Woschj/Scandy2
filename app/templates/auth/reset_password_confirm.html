{% extends "base.html" %}

{% block title %}Passwort setzen - {{ config.SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="card w-96 bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-key text-primary-content text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">Passwort setzen</h1>
                <p class="text-sm opacity-70">{{ config.SYSTEM_NAME }}</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-control mb-4">
                    <label class="label" for="new_password">
                        <span class="label-text">Neues Passwort</span>
                    </label>
                    <div class="join w-full">
                        <input type="password" id="new_password" name="new_password" class="input input-bordered join-item w-full" required minlength="8" autofocus aria-required="true">
                        <button type="button" class="btn btn-outline join-item" onclick="window.togglePasswordVisibility('new_password', this)" aria-label="Passwort anzeigen" title="Passwort anzeigen">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-control mb-6">
                    <label class="label" for="confirm_password">
                        <span class="label-text">Passwort bestätigen</span>
                    </label>
                    <div class="join w-full">
                        <input type="password" id="confirm_password" name="confirm_password" class="input input-bordered join-item w-full" required minlength="8" aria-required="true">
                        <button type="button" class="btn btn-outline join-item" onclick="window.togglePasswordVisibility('confirm_password', this)" aria-label="Passwort anzeigen" title="Passwort anzeigen">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fas fa-save me-2"></i>
                        Passwort speichern
                    </button>
                </div>
            </form>

            <div class="divider">Abbrechen</div>

            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="link-hover text-sm flex items-center justify-center gap-2 opacity-70 hover:opacity-100 hover:text-primary transition-all">
                    <i class="fas fa-arrow-left"></i>
                    Zurück zum Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
