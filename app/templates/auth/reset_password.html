{% extends "base.html" %}

{% block title %}Passwort zurücksetzen{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="card w-96 bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="text-2xl font-bold mb-4"><i class="fas fa-unlock-alt text-primary mr-2"></i>Passwort zurücksetzen</h1>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-control mb-4">
                    <label class="label" for="username">
                        <span class="label-text">Benutzername oder E-Mail</span>
                    </label>
                    <input type="text" id="username" name="username" class="input input-bordered" required autofocus aria-required="true">
                </div>
                <button class="btn btn-primary w-full" type="submit">
                    <i class="fas fa-paper-plane mr-2"></i>
                    Zurücksetzen
                </button>
            </form>
            <div class="text-center mt-6">
                <a class="link link-hover text-sm flex items-center justify-center" href="{{ url_for('auth.login') }}">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Zurück zum Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
