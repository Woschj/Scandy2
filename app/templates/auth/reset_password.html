{% extends "base.html" %}

{% block title %}Passwort zurücksetzen - {{ config.SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="card w-96 bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-unlock-alt text-primary-content text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">Passwort zurücksetzen</h1>
                <p class="text-sm opacity-70">{{ config.SYSTEM_NAME }}</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-control mb-6">
                    <label class="label" for="username">
                        <span class="label-text">Benutzername oder E-Mail</span>
                    </label>
                    <input type="text" id="username" name="username" class="input input-bordered" required autofocus aria-required="true">
                </div>

                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fas fa-paper-plane me-2"></i>
                        Zurücksetzen
                    </button>
                </div>
            </form>

            <div class="divider">Erinnerst du dich?</div>

            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="link-hover text-sm flex items-center justify-center gap-2 opacity-70 hover:opacity-100 hover:text-primary transition-all">
                    <i class="fas fa-arrow-left"></i>
                    Zurück zum Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
