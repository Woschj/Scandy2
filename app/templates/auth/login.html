{% extends "base.html" %}

{% block title %}Anmeldung - {{ config.SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 transition-colors duration-300">
    <div class="card w-96 bg-base-100 shadow-2xl border border-base-content/5">
        <div class="card-body p-8">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-primary/10 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-fingerprint text-primary text-3xl"></i>
                </div>
                <h1 class="text-3xl font-black text-base-content mb-2 tracking-tight">
                    Anmeldung
                </h1>
                <p class="text-xs uppercase tracking-widest font-bold text-base-content/40">{{ config.SYSTEM_NAME }}</p>
            </div>

            {% if error %}
            <div class="alert alert-error mb-4">
                <i class="fas fa-exclamation-circle mr-2"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Benutzername</span>
                    </label>
                    <input type="text" name="username" class="input input-bordered" required autofocus>
                </div>

                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Passwort</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered" required>
                </div>

                <div class="form-control mb-6">
                    <label class="label cursor-pointer">
                        <span class="label-text">Angemeldet bleiben</span>
                        <input type="checkbox" name="remember" class="checkbox checkbox-primary">
                    </label>
                </div>

                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Anmelden
                    </button>
                </div>
            </form>

            <div class="divider">Passwort vergessen?</div>

            <div class="text-center">
                <a href="{{ url_for('auth.reset_password') }}" class="btn btn-secondary btn-sm hover:shadow-md transform hover:-translate-y-0.5 transition-all duration-200">
                    <i class="fas fa-unlock-alt me-2"></i>
                    Passwort zurücksetzen
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
