{% extends "base.html" %}

{% block title %}Anmeldung - {{ config.SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);">
    <div class="card w-96 bg-white shadow-xl border-0" style="border-radius: 1rem; border: 1px solid #e3f2fd;">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4" style="box-shadow: 0 4px 15px rgba(0, 102, 204, 0.3);">
                    <i class="fas fa-sign-in-alt text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">
                    Anmeldung
                </h1>
                <p class="text-sm text-gray-600">{{ config.SYSTEM_NAME }}</p>
            </div>

            {% if error %}
            <div class="alert alert-error mb-4">
                <i class="fas fa-exclamation-circle mr-2"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-control mb-4">
                    <label class="label" for="username">
                        <span class="label-text">Benutzername</span>
                    </label>
                    <input type="text" id="username" name="username" class="input input-bordered" required autofocus aria-required="true">
                </div>

                <div class="form-control mb-4">
                    <label class="label" for="password">
                        <span class="label-text">Passwort</span>
                    </label>
                    <div class="join w-full">
                        <input type="password" id="password" name="password" class="input input-bordered join-item w-full" required aria-required="true">
                        <button type="button" class="btn btn-bordered join-item" onclick="window.togglePasswordVisibility('password', this)" title="Passwort anzeigen" aria-label="Passwort anzeigen">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-control mb-6">
                    <label class="label cursor-pointer" for="remember">
                        <span class="label-text">Angemeldet bleiben</span>
                        <input type="checkbox" id="remember" name="remember" class="checkbox checkbox-primary">
                    </label>
                </div>

                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Anmelden
                    </button>
                </div>
            </form>

            <div class="divider">Passwort vergessen?</div>

            <div class="text-center">
                <a href="{{ url_for('auth.reset_password') }}" class="btn btn-secondary btn-sm hover:shadow-md transform hover:-translate-y-0.5 transition-all duration-200">
                    <i class="fas fa-unlock-alt me-2"></i>
                    Passwort zurücksetzen
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
