name: scandy_desktop
description: Scandy - Werkzeug- und Verbrauchsmaterialverwaltung (Windows Desktop)
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  
  # State Management
  provider: ^6.1.1
  
  # Database (Desktop optimiert)
  sqflite_common_ffi: ^2.3.2
  sqflite_common: ^2.5.4
  path: ^1.8.3
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Barcode Scanner
  mobile_scanner: ^3.5.6
  
  # File Operations
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  
  # Charts & Data Visualization
  fl_chart: ^0.66.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Image Handling
  image_picker: ^1.0.4
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utils
  uuid: ^4.2.1
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
